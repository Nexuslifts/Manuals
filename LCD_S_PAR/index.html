<title>LCD_S_PAR — Manuale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --neon:#7AEDCC;
    --deep:#3DB28B;
    --circuit:#B2B5BF;
    --carbon:#333940;
    --onyx:#000000;
    --bg:#F6F6F5;
    --card:#ffffff;
    --neon-10:#EAFBF5;
    --neon-40:#D6F3E7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--carbon);
    padding:24px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border:1px solid #e4e4e2;
    border-radius:16px;
    padding:36px 30px 30px;
    text-align:center;
  }
  .logo{
    height:34px;
    width:auto;
    margin:0 auto 28px;
    display:block;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;
    font-weight:700;
    margin:0 0 6px;
    color:var(--onyx);
  }
  .sub{
    font-size:14px;
    color:var(--circuit);
    margin:0 0 26px;
  }
  .langs{
    display:grid;
    gap:10px;
  }
  a.lang{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border:1px solid var(--neon-40);
    border-radius:10px;
    text-decoration:none;
    color:var(--carbon);
    font-weight:500;
    font-size:15px;
    background:var(--neon-10);
    transition:filter .15s, transform .15s, border-color .15s;
  }
  a.lang:hover{
    filter:brightness(0.98);
    transform:translateY(1px);
    border-color:var(--deep);
  }
  a.lang .left{display:flex;align-items:center;gap:12px;}
  a.lang .flag{
    width:26px;height:19px;border-radius:3px;overflow:hidden;flex:none;
    box-shadow:0 0 0 1px rgba(0,0,0,0.08);
  }
  a.lang .flag svg{display:block;width:100%;height:100%;}

  .arrow-ico{
    flex:none;
    width:16px;height:30px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  .arrow-ico svg{
    width:100%;height:100%;
    animation:bounce 1.5s ease-in-out infinite;
  }
  @keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(7px);}
  }
  @media (prefers-reduced-motion: reduce){
    .arrow-ico svg{animation:none;}
  }
  footer{
    margin-top:26px;
    font-size:12px;
    color:var(--circuit);
    letter-spacing:.02em;
  }
</style>
</head>
